---
name: CI/CD Pipeline - Tech Challenge Mechanic
on:
  push:
    branches:
      - main
jobs:
  build-and-test:
    name: 1. Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar ambiente .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"
      - name: Restaurar dependências
        run: dotnet restore ./Mechanic/Mechanic.sln
      - name: Executar o Build da aplicação
        run: dotnet build ./Mechanic/Mechanic.sln --no-restore --configuration Release
      - name: Executar os testes automatizados
        run: dotnet test ./Mechanic.Tests/Mechanic.Tests.csproj --configuration Release
  docker-and-deploy:
    name: 2. Docker Build & Terraform Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Fazer Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build da imagem Docker e Push
        uses: docker/build-push-action@v5
        with:
          context: ./Mechanic
          file: ./Mechanic/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mechanic-api:latest
      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Configurar o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: Executar Terraform Apply (Deploy AWS)
        run: >
          terraform init

          # Etapa A: Cria primeiro a rede e o cluster EKS, ignorando os manifestos por enquanto

          terraform apply -target=module.vpc -target=module.eks -var="is_local=false" -auto-approve


          # Etapa B: Com o cluster pronto na nuvem, aplica todo o resto (YAMLs, Banco, API)

          terraform apply -var="is_local=false" -auto-approve
        working-directory: ./Mechanic/terraform
