name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Docker
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: ./Mechanic
          file: ./Mechanic/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mechanic-api:latest

      # Simulação de deploy (para CI/CD)
      - name: Simular deploy Kubernetes
        run: echo "kubectl apply -f ./Mechanic/k8s"