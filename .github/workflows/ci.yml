name: CI

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore ./Mechanic/Mechanic.sln
      - run: dotnet build ./Mechanic/Mechanic.sln --no-restore --configuration Release
      - run: dotnet test ./Mechanic.Tests/Mechanic.Tests.csproj