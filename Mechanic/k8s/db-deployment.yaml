apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanic-db
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mechanic-db

  template:
    metadata:
      labels:
        app: mechanic-db

    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest

          ports:
            - containerPort: 1433

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mechanic-secret
                  key: dbPassword

          volumeMounts:
            - name: sql-data
              mountPath: /var/opt/mssql

      volumes:
        - name: sql-data
          persistentVolumeClaim:
            claimName: sql-pvc